<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Fale com a gente</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", sans-serif;
            color: #20283a;
            background: #f4f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background:
                radial-gradient(ellipse at 12% 10%, #e8edff 0, transparent 38%),
                radial-gradient(ellipse at 90% 90%, #e5f5f2 0, transparent 34%),
                #f4f6fb;
        }

        .contact-card {
            width: min(100%, 560px);
            padding: clamp(28px, 6vw, 48px);
            border: 1px solid #e8ebf2;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px rgb(34 48 78 / 10%);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #5865d8;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.35rem);
            letter-spacing: -0.045em;
        }

        .intro {
            margin: 12px 0 30px;
            color: #687187;
            line-height: 1.65;
        }

        .form-field {
            display: grid;
            gap: 9px;
            margin-bottom: 22px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 650;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #dfe3ec;
            border-radius: 12px;
            padding: 13px 15px;
            background-color: #fbfcfe;
            color: #20283a;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
        }

        input,
        select {
            min-height: 50px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9aa2b2;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #6873e6;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgb(104 115 230 / 14%);
        }

        button {
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 12px;
            background: #5865d8;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            background: #4653c5;
            box-shadow: 0 8px 18px rgb(88 101 216 / 24%);
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #aeb5ff;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="contact-card">
        <p class="eyebrow">Estamos aqui para ajudar</p>
        <h1>Fale com a gente</h1>
        <p class="intro">Conte um pouco sobre o que você precisa. Vamos retornar assim que possível.</p>

        <form action="">
            <div class="form-field">
                <label for="nome">Seu nome</label>
                <input type="text" name="nome" id="nome" placeholder="Como podemos chamar você?" autocomplete="name" required>
            </div>

            <div class="form-field">
                <label for="assunto">Assunto</label>
                <select name="assunto" id="assunto" required>
                    <option value="" selected disabled>Escolha uma opção</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="outro">Outro assunto</option>
                </select>
            </div>

            <div class="form-field">
                <label for="msg">Sua mensagem</label>
                <textarea name="msg" id="msg" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
            </div>

            <button type="submit">Enviar mensagem</button>
        </form>
    </main>
</body>
</html>
